spring.application.name=experiment-5.2

spring.datasource.url=jdbc:h2:mem:postdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.experiment52=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [correlationId=%X{correlationId}] %logger{36} - %msg%n
